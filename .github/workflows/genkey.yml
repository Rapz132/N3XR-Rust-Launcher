name: Generate Keystore
on: workflow_dispatch
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          keytool -genkeypair -keystore zalith_launcher.jks \
            -alias movtery_zalith -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASSWORD" -keypass "$STORE_PASSWORD" \
            -dname "CN=N3XR, O=N3XR, C=ID"
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: zalith_launcher.jks