name: Generate Keystore
on: workflow_dispatch
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - run: |
          keytool -genkeypair -keystore zalith_launcher.jks \
            -alias movtery_zalith -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass GANTI_PASSWORD -keypass GANTI_PASSWORD \
            -dname "CN=N3XR, O=N3XR, C=ID"
          base64 -w0 zalith_launcher.jks > ks.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: |
            zalith_launcher.jks
            ks.txt